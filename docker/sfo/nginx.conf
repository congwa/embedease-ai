# 独立 IP 端口入口，API 和 WebSocket 直接代理以保留流式响应。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name embedease-ai.sub2.org;
    ssl_certificate /etc/letsencrypt/live/embedease-ai.sub2.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/embedease-ai.sub2.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    access_log /srv/embedease-ai/logs/nginx-access.log;
    error_log /srv/embedease-ai/logs/nginx-error.log warn;
    location /api/ {
        proxy_pass http://127.0.0.1:19360;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:19360;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
    }
    location /upload/ {
        proxy_pass http://127.0.0.1:19360;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:19362/;
        proxy_set_header Host $proxy_host;
    }
    location /health {
        proxy_pass http://127.0.0.1:19360;
    }
    location / {
        proxy_pass http://127.0.0.1:19361;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name embedease-ai.sub2.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
